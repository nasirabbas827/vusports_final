{% extends 'base.html' %}

{% block title %}Admin Portal | VU Sports{% endblock %}

{% block content %}
<div class="container mt-4 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg" style="max-width: 450px; width: 100%; border-radius: 20px; overflow: hidden;">
        
        <div class="card-header border-0 text-white text-center py-5" 
             style="background: linear-gradient(135deg, #1e1e2f 0%, #2d3436 100%);">
            <div class="mb-3">
                <i class="fas fa-user-lock fa-4x text-accent"></i>
            </div>
            <h2 class="font-weight-bold mb-0 text-white">Admin Access</h2>
            <p class="small opacity-75">Secure Management Terminal</p>
        </div>

        <div class="card-body p-4 p-md-5">
            {% if error %}
            <div class="alert alert-danger border-0 shadow-sm small text-center mb-4" role="alert" style="border-radius: 10px;">
                <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/adminlogin">
                <div class="form-group mb-4">
                    <label for="username" class="small font-weight-bold text-uppercase text-muted">Admin Username</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-user-cog text-primary"></i></span>
                        </div>
                        <input type="text" 
                               class="form-control form-control-lg bg-light border-0 shadow-none" 
                               id="username" 
                               name="username" 
                               placeholder="Enter username"
                               required 
                               style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="small font-weight-bold text-uppercase text-muted">System Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-key text-primary"></i></span>
                        </div>
                        <input type="password" 
                               class="form-control form-control-lg bg-light border-0 shadow-none" 
                               id="password" 
                               name="password" 
                               placeholder="••••••••"
                               required 
                               style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>

                <button type="submit" class="btn btn-dark btn-lg w-100 shadow mt-2 py-3 font-weight-bold" 
                        style="border-radius: 12px; transition: 0.3s;">
                    Enter Dashboard <i class="fas fa-unlock-alt ml-2"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/" class="text-muted small"><i class="fas fa-arrow-left mr-1"></i> Return to Public Site</a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Specific hover effect for Admin login button */
    .btn-dark:hover {
        background-color: #000;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2) !important;
    }
</style>
{% endblock %}
