{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="card mx-auto border-0 shadow-lg" style="max-width: 600px; border-radius: 20px; overflow: hidden;">
        <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0 font-weight-bold text-white">Participant Registration</h3>
            <p class="small mb-0" style="opacity: 0.9;">Sign up to participate in VU Sports activities</p>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 form-group mb-4">
                        <label for="vu_id" class="font-weight-600"><i class="fas fa-id-card mr-2 text-primary"></i>VU ID</label>
                        <input type="text" name="vu_id" id="vu_id" class="form-control shadow-sm" placeholder="BC123456789" required>
                    </div>
                    <div class="col-md-6 form-group mb-4">
                        <label for="full_name" class="font-weight-600"><i class="fas fa-user mr-2 text-primary"></i>Full Name</label>
                        <input type="text" name="full_name" id="full_name" class="form-control shadow-sm" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="email" class="font-weight-600"><i class="fas fa-envelope mr-2 text-primary"></i>Email Address</label>
                    <input type="email" name="email" id="email" class="form-control shadow-sm" placeholder="Participant@vu.edu.pk" required>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="font-weight-600"><i class="fas fa-lock mr-2 text-primary"></i>Password</label>
                    <input type="password" name="password" id="password" class="form-control shadow-sm" placeholder="••••••••" required>
                </div>

                <div class="form-group mb-4">
                    <label for="sports" class="font-weight-600 d-flex justify-content-between">
                        <span><i class="fas fa-medal mr-2 text-primary"></i>Select Sports</span>
                        <span class="badge badge-soft-primary text-primary" style="background: #eef2ff;">Max 2</span>
                    </label>
                    <select name="sport_ids" id="sports" class="form-control shadow-sm" multiple required style="height: 120px; border-radius: 12px; padding: 10px;">
                        {% for s in sports %}
                        <option value="{{ s[0] }}" class="py-2 px-3 border-bottom">{{ s[1] }}</option>
                        {% endfor %}
                    </select>
                    <small class="form-text text-muted mt-2">Hold Ctrl (Windows) or Command (Mac) to select two sports.</small>
                </div>

                <button class="btn btn-primary btn-lg w-100 shadow mt-2 py-3" style="border-radius: 12px;">
                    Create Account <i class="fas fa-check-circle ml-2"></i>
                </button>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted small">Need to manage your sports? <a href="{{ url_for('participant_login') }}" class="text-primary font-weight-bold">Login</a></p>
            </div>
            <div class="text-center mt-4">
                <p class="text-muted small">Need to manage your sports? <a href="{{ url_for('coach_register') }}" class="text-primary font-weight-bold">Register As Coach</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Specific styling for the multi-select */
    select[multiple]:focus option:checked {
        background: var(--primary) linear-gradient(0deg, var(--primary) 0%, var(--primary) 100%);
        color: white;
    }
    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.15) !important;
    }
</style>
{% endblock %}
