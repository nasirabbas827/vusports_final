{% extends 'base.html' %}

{% block content %}
<div class="container mt-3 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg" style="max-width: 420px; width: 100%; border-radius: 24px; overflow: hidden;">
        <div class="card-header bg-primary text-white text-center py-4 border-0">
            <div class="mb-2">
                <i class="fas fa-running fa-3x"></i>
            </div>
            <h4 class="font-weight-bold mb-0 text-white">Participant Login</h4>
            <p class="small mb-0 opacity-90">Access your sports dashboard</p>
        </div>
        <div class="card-body p-4 p-md-5">
            <form method="POST">
                <div class="form-group mb-4">
                    <label for="email" class="small font-weight-bold text-uppercase text-muted">Registered Email</label>
                    <div class="input-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-white border-right-0"><i class="fas fa-user text-primary"></i></span>
                        </div>
                        <input type="email" name="email" id="email" class="form-control form-control-lg border-left-0" placeholder="Participant@vu.edu.pk" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="small font-weight-bold text-uppercase text-muted">Password</label>
                    <div class="input-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-white border-right-0"><i class="fas fa-key text-primary"></i></span>
                        </div>
                        <input type="password" name="password" id="password" class="form-control form-control-lg border-left-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button class="btn btn-primary btn-lg w-100 shadow-sm py-3 font-weight-bold mt-2" style="border-radius: 12px;">
                    Login to Account <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="small text-muted">Don't have an account?</span>
                <br>
                <a href="{{ url_for('participant_register') }}" class="btn btn-outline-primary btn-sm mt-2 px-4" style="border-radius: 20px;">Register Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
