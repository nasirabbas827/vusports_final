{% extends 'base.html' %}

{% block content %}
<div class="container mt-3 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg" style="max-width: 420px; width: 100%; border-radius: 24px; overflow: hidden;">
        <div class="card-header bg-dark text-white text-center py-4 border-0">
            <div class="mb-2">
                <i class="fas fa-user-shield fa-3x text-accent"></i>
            </div>
            <h4 class="font-weight-bold mb-0 text-white">Coach Portal</h4>
            <p class="small mb-0 opacity-75">Welcome back, Coach!</p>
        </div>
        <div class="card-body p-4 p-md-5">
            <form method="POST">
                <div class="form-group mb-4">
                    <label for="email" class="small font-weight-bold text-uppercase text-muted">Email Address</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-primary"></i></span>
                        </div>
                        <input type="email" id="email" name="email" class="form-control form-control-lg bg-light border-0 shadow-none" placeholder="coach@vu.edu.pk" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="small font-weight-bold text-uppercase text-muted">Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-primary"></i></span>
                        </div>
                        <input type="password" id="password" name="password" class="form-control form-control-lg bg-light border-0 shadow-none" placeholder="••••••••" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>

                <button class="btn btn-primary btn-lg w-100 shadow-sm py-3 font-weight-bold" style="border-radius: 12px;">
                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                </button>
            </form>

            <div class="text-center mt-4 pt-2">
                <p class="small text-muted">New coach? <a href="{{ url_for('coach_register') }}" class="text-primary font-weight-bold">Apply for registration</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
